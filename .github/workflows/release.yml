name: Release Windows app
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    outputs:
      version: ${{ steps.version.outputs.version }}
      checksums: ${{ steps.checksums.outputs.checksums }}
    steps:
      - name: Checkout (v7)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - name: Check release version and history
        id: version
        run: |
          $metadata = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Could not read package metadata' }
          $version = (($metadata | ConvertFrom-Json).packages | Where-Object name -eq 'nolae-companion').version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -cne "v$version") { throw 'Release tag must match the stable package version' }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tags must point to a commit on main' }
          $history = (Get-Content release/updates.json -Raw | ConvertFrom-Json).releases
          if ($history[-1].version -cne $version) { throw 'Update history must end with the release version' }
          $tags = git tag --list 'v*' | Where-Object { $_ -cmatch '^v\d+\.\d+\.\d+$' -and $_ -cne $env:GITHUB_REF_NAME } | ForEach-Object { [version]$_.Substring(1) }
          if ($tags | Where-Object { $_ -ge [version]$version }) { throw 'A release tag at or above this version already exists' }
          $previous = $tags | Sort-Object -Descending | Select-Object -First 1
          if ($previous) {
            $published = (git show "v${previous}:release/updates.json" | Out-String | ConvertFrom-Json).releases
            if ($published.Count -ge $history.Count) { throw 'Update history must add this release' }
            for ($i = 0; $i -lt $published.Count; $i++) {
              if ($published[$i].version -cne $history[$i].version -or $published[$i].priority -cne $history[$i].priority) { throw 'Update history must keep earlier entries unchanged' }
            }
          }
          "version=$version" | Add-Content $env:GITHUB_OUTPUT
          "APP_VERSION=$version" | Add-Content $env:GITHUB_ENV
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - name: Check built version
        run: |
          $built = (& target/release/nolae-companion.exe --version | Out-String).Trim()
          if ($built -cne $env:APP_VERSION) { throw 'Built core reports the wrong version' }
          foreach ($file in 'nolae-companion.exe', 'nolae-companion-ui.exe') {
            if ((Get-Item "target/release/$file").VersionInfo.ProductVersion -cne $env:APP_VERSION) { throw "Built $file has the wrong product version" }
          }
      - run: cargo install cargo-about --version '=0.8.4' --locked
      - name: Prepare installer tools
        run: |
          New-Item -ItemType Directory -Force .cache | Out-Null
          curl.exe --fail --location --retry 3 --max-time 120 --output .cache/nsis.zip 'https://phoenixnap.dl.sourceforge.net/project/nsis/NSIS%203/3.13/nsis-3.13.zip'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS download failed' }
          if ((Get-FileHash .cache/nsis.zip -Algorithm SHA256).Hash -ne 'ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8') { throw 'NSIS checksum mismatch' }
          Expand-Archive .cache/nsis.zip -DestinationPath .cache
      - name: Collect package files
        run: |
          New-Item -ItemType Directory -Force dist/package/licenses | Out-Null
          Copy-Item target/release/nolae-companion.exe, target/release/nolae-companion-ui.exe dist/package
          Copy-Item LICENSE, assets/fonts/OFL-Manrope.txt dist/package/licenses
          cargo-about generate about.hbs --locked --manifest-path Cargo.toml --output-file dist/package/licenses/THIRD_PARTY_NOTICES.html
          if ($LASTEXITCODE -ne 0) { throw 'License collection failed' }
      - name: Create update archives
        run: |
          Push-Location dist/package
          tar.exe -a -cf "../nolae-companion-v${env:APP_VERSION}-x86_64-pc-windows-msvc.zip" nolae-companion.exe nolae-companion-ui.exe licenses/LICENSE licenses/OFL-Manrope.txt licenses/THIRD_PARTY_NOTICES.html
          if ($LASTEXITCODE -ne 0) { throw 'Update archive failed' }
          Pop-Location
          Push-Location release
          tar.exe -a -cf ../dist/companion-updates.zip updates.json
          if ($LASTEXITCODE -ne 0) { throw 'Update history archive failed' }
          Pop-Location
      - name: Build installer
        run: .cache/nsis-3.13/Bin/makensis.exe /V2 "/DAPP_VERSION=$env:APP_VERSION" "/DAPP_EXE=$env:GITHUB_WORKSPACE\target\release\nolae-companion.exe" "/DGUI_EXE=$env:GITHUB_WORKSPACE\target\release\nolae-companion-ui.exe" "/DNOTICES_FILE=$env:GITHUB_WORKSPACE\dist\package\licenses\THIRD_PARTY_NOTICES.html" "/DOUTPUT_FILE=$env:GITHUB_WORKSPACE\dist\nolae-companion-setup.exe" installer/windows.nsi
      - name: Record unsigned checksums
        id: checksums
        run: |
          $files = "dist/nolae-companion-v${env:APP_VERSION}-x86_64-pc-windows-msvc.zip", 'dist/companion-updates.zip', 'dist/nolae-companion-setup.exe'
          $sums = (Get-FileHash $files -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLowerInvariant()):$([IO.Path]::GetFileName($_.Path))" }) -join ','
          "checksums=$sums" | Add-Content $env:GITHUB_OUTPUT
      - name: Upload unsigned release files (v7.0.2)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: unsigned-release
          path: |
            dist/nolae-companion-v${{ steps.version.outputs.version }}-x86_64-pc-windows-msvc.zip
            dist/companion-updates.zip
            dist/nolae-companion-setup.exe
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    env:
      APP_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout (v7)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download unsigned release files (v8.0.2)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: unsigned-release
          path: dist
      - name: Verify build output
        env:
          CHECKSUMS: ${{ needs.build.outputs.checksums }}
        run: |
          $expected = $env:CHECKSUMS -split ','
          if ((Get-ChildItem dist -File).Count -ne $expected.Count) { throw 'Unexpected release files' }
          foreach ($entry in $expected) {
            $hash, $name = $entry -split ':', 2
            if ((Get-FileHash (Join-Path dist $name) -Algorithm SHA256).Hash.ToLowerInvariant() -cne $hash) { throw "Checksum mismatch for $name" }
          }
      - run: rustup toolchain install
      - run: cargo install zipsign --version '=0.2.2' --locked
      - name: Sign and verify update
        env:
          NOLAE_UPDATE_SIGNING_KEY: ${{ secrets.NOLAE_UPDATE_SIGNING_KEY }}
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'nolae-companion-update.key'
          $archive = "dist/nolae-companion-v${env:APP_VERSION}-x86_64-pc-windows-msvc.zip"
          try {
            $key = [Convert]::FromBase64String($env:NOLAE_UPDATE_SIGNING_KEY)
            if ($key.Length -ne 64) { throw 'Expected a 64-byte publisher private key' }
            [IO.File]::WriteAllBytes($keyPath, $key)
            Remove-Item Env:NOLAE_UPDATE_SIGNING_KEY
            foreach ($file in $archive, 'dist/companion-updates.zip') {
              zipsign sign zip $file $keyPath
              if ($LASTEXITCODE -ne 0) { throw "Signing failed for $file" }
              zipsign verify zip $file release/publisher.pub
              if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $file" }
            }
          } finally {
            Remove-Item -LiteralPath $keyPath -ErrorAction SilentlyContinue
          }
      - name: Write checksums
        run: |
          Get-FileHash "dist/nolae-companion-v${env:APP_VERSION}-x86_64-pc-windows-msvc.zip", dist/nolae-companion-setup.exe, dist/companion-updates.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content dist/SHA256SUMS -Encoding ascii
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $notes = Join-Path $env:RUNNER_TEMP 'companion-release-notes.md'
          $download = "https://github.com/$env:GH_REPO/releases/download/$env:GITHUB_REF_NAME/nolae-companion-setup.exe"
          "## [Download for Windows]($download)`n`nWindows 10/11 · 64-bit · Spotify desktop`n`n[Setup and help](https://docs.nolae.app/companion)`n`nCompanion downloads the updater files automatically when you choose Update. For a new installation, download the Windows installer above." | Set-Content $notes -Encoding utf8
          gh release create $env:GITHUB_REF_NAME --verify-tag --draft --generate-notes --notes-file $notes --title "Nolae Companion v$env:APP_VERSION" "dist/nolae-companion-v${env:APP_VERSION}-x86_64-pc-windows-msvc.zip#Automatic updater package" 'dist/nolae-companion-setup.exe#Download for Windows' 'dist/companion-updates.zip#Automatic updater release history' 'dist/SHA256SUMS#Download checksums'
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }

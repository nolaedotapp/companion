[package]
name = "nolae-companion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
nolae-agent = { path = "../agent" }
nolae-core = { path = "../core" }
semver = "1"
tray-icon = { version = "0.26.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[build-dependencies]
winresource = { version = "=0.1.34", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Security", "Win32_Graphics_Gdi"] }
